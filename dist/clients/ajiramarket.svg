<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" width="280" height="80" fill="none">
  <defs>
    <linearGradient id="c1_loop_main" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="45%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#6B21A8"/>
    </linearGradient>
    <linearGradient id="c1_bridge_main" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="c1_glow_main" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Ribbon Mark -->
  <g transform="translate(10, 7)">
    <path d="M12 54 L34 14 L48 42 L58 22 L74 54" stroke="url(#c1_loop_main)" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="34" cy="14" r="4.5" fill="#00E5FF" filter="url(#c1_glow_main)"/>
    <path d="M23 39 H51" stroke="url(#c1_bridge_main)" stroke-width="5.5" stroke-linecap="round"/>
    <circle cx="74" cy="54" r="4.5" fill="#6B21A8"/>
  </g>
  <!-- Text -->
  <text x="105" y="44" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="28" fill="#ffffff" letter-spacing="-0.5">AJIRA</text>
  <text x="106" y="62" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="12" fill="#00E5FF" letter-spacing="4">MARKET</text>
</svg>
